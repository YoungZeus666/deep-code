[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deep-code"
version = "0.1.0"
description = "AI programming assistant built on LangChain Deep Agents"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.6.4",
    "langchain-anthropic>=1.4.3",
    "langchain-openai>=1.2.2",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "prompt_toolkit>=3.0.0",
    "pytest>=8.0.0",
    "langfuse>=4.6.1",
]

[project.scripts]
deep-code = "deep_code.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/deep_code"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
